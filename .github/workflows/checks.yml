name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

  follower-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt -r tools/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: python tools/test_score_follower_browser.py
      - run: npm run build:demo
        working-directory: frontend
      - run: python tools/test_public_demo_browser.py
      - run: python tools/refresh_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: cadence-ui-screenshots
          retention-days: 14
          path: |
            docs/laptop-light.png
            docs/laptop-dark.png
            docs/phone-light.png
            docs/phone-dark.png
            docs/preview.jpg
            docs/submission-preview.png
            docs/transcription.png
            docs/sheet-music.png

